services:
  postgres:
    image: postgres:15-alpine
    container_name: fleet_postgres
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fleet_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleet_user} -d ${POSTGRES_DB:-fleet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleet_net

  kafka:
    image: apache/kafka:3.8.0
    container_name: fleet_kafka
    restart: unless-stopped
    mem_limit: 700m
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./data:/data
    networks:
      - fleet_net

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: fleet_kafka_init
    depends_on:
      - kafka
    mem_limit: 256m
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kafka broker at kafka:9092..."
        for i in $$(seq 1 30); do
          if /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; then
            echo "Kafka is ready! Creating topic '${KAFKA_TOPIC:-ride_events}' with ${KAFKA_PARTITIONS:-3} partitions..."
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
              --create --if-not-exists \
              --topic "${KAFKA_TOPIC:-ride_events}" \
              --partitions "${KAFKA_PARTITIONS:-3}" \
              --replication-factor 1
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
              --describe --topic "${KAFKA_TOPIC:-ride_events}"
            exit 0
          fi
          sleep 3
        done
        echo "Kafka did not become ready in time."
        exit 1
    networks:
      - fleet_net

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: fleet-airflow-spark:2.9.3
    container_name: fleet_airflow
    restart: unless-stopped
    mem_limit: 2048m
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "120"
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "60"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "60"
    ports:
      - "8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark:/opt/airflow/spark
      - ./data:/data
    command: >
      bash -c "
      airflow db migrate &&
      (airflow users create --username admin --password admin --firstname Fleet --lastname Admin --role Admin --email admin@fleet.local || true) &&
      exec airflow standalone
      "
    networks:
      - fleet_net

volumes:
  postgres_data:
  kafka_data:

networks:
  fleet_net:
    driver: bridge